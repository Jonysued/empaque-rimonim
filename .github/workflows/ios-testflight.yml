name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/App/App/Assets.xcassets/AppIcon.appiconset/**'
      - 'ios/App/App.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-testflight.yml'

jobs:
  upload:
    runs-on: macos-15-intel
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://app.empaco.com.ar
      APPLE_TEAM_ID: D93K7CHP66
      IOS_PROFILE_NAME: Rimonim Empaque App Store
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    steps:
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify required configuration
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then echo "Missing $name" >&2; exit 1; fi
          done
      - name: Build web assets and sync iOS
        run: npm run lint && npm run typecheck && node scripts/check-offline-queue.mjs && npm run check:cold-storage && npm run check:app && npm run mobile:ios:sync
      - name: Install signing assets
        env:
          RUNNER_TEMP_KEYCHAIN: ${{ runner.temp }}/rimonim-signing.keychain-db
        run: |
          set -euo pipefail
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/rimonim.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/rimonim.mobileprovision"
          # Apple's keychain cannot import the newer PBES2 encryption used by
          # OpenSSL 3 when the PKCS#12 file is exported with its defaults.
          brew_openssl="$(brew --prefix openssl@3)/bin/openssl"
          "$brew_openssl" pkcs12 -in "$RUNNER_TEMP/rimonim.p12" \
            -passin env:IOS_CERTIFICATE_PASSWORD -nodes -out "$RUNNER_TEMP/signing.pem"
          "$brew_openssl" pkcs12 -export -legacy -in "$RUNNER_TEMP/signing.pem" \
            -out "$RUNNER_TEMP/rimonim-legacy.p12" -passout env:IOS_CERTIFICATE_PASSWORD
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/rimonim.mobileprovision")")
          cp "$RUNNER_TEMP/rimonim.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP_KEYCHAIN"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP_KEYCHAIN"
          security import "$RUNNER_TEMP/rimonim-legacy.p12" -k "$RUNNER_TEMP_KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP_KEYCHAIN"
          security default-keychain -d user -s "$RUNNER_TEMP_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP_KEYCHAIN"
      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RimonimEmpaque.xcarchive"
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>app.rimonim.empaque</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RimonimEmpaque.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/ios-export/App.ipa" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
      - name: Enable internal TestFlight testing
        run: |
          build_number=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP/RimonimEmpaque.xcarchive/Products/Applications/App.app/Info.plist")
          BUILD_NUMBER="$build_number" node scripts/finalize-testflight.mjs
