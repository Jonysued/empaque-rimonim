name: iOS simulator build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'scripts/check-offline-queue.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://app.empaco.com.ar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify configuration
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
      - run: npm run lint && npm run typecheck && node scripts/check-offline-queue.mjs && npm run check:cold-storage && npm run check:app && npm run mobile:ios:sync
      - name: Compile for iOS simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
