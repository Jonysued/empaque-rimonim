name: Enable iOS TestFlight build

on:
  push:
    branches: [main]
    paths: ['scripts/testflight-release.json']
  workflow_dispatch:
    inputs:
      build_number:
        description: iOS build number
        required: true
        default: '12'
      release_external:
        description: Enable the existing confirmed external group
        type: boolean
        default: false

jobs:
  enable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_EXTERNAL: ${{ inputs.release_external }}
      RELEASE_CONFIG: ${{ github.event_name == 'push' && 'scripts/testflight-release.json' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-testflight-release.mjs
      - run: node scripts/finalize-testflight.mjs
