name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'resources/**'
      - 'scripts/configure-android.mjs'
      - 'src/**'
      - 'scripts/check-offline-queue.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://app.empaco.com.ar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify configuration
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
      - run: npm run lint && npm run typecheck && node scripts/check-offline-queue.mjs && npm run check:cold-storage && npm run check:app && npm run mobile:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rimonim-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
